name: vulnfc12
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.12.13
  - pip
  - pip:
    # Versions are the ones that produced the reported numbers. scipy is pinned
    # because Wilcoxon's exact/approximate switch and its tie handling change
    # reported p-values.
    - scipy==1.17.1
    - numpy==1.26.4
    - scikit-learn==1.8.0
    - pandas==2.2.2
    - matplotlib==3.9.0
    - torch==2.2.2
    - transformers==4.57.6
    - datasets==4.8.4
    - accelerate==1.13.0
    - openai==2.32.0
    - faiss-cpu==1.13.2
    - sentence-transformers==5.4.1
    # LoRA fine-tuning only (GPU required; not needed for any reported table):
    # - peft>=0.12.0
    # - trl>=0.11.0
    # - bitsandbytes>=0.43.0
    # - huggingface-hub>=0.24.0
